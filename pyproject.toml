[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ors"
version = "0.0.1"
description = "Explainable optimization: diagnose infeasible and unbounded models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ors contributors" }]
keywords = ["optimization", "linear-programming", "infeasibility", "IIS", "operations-research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
highs = ["highspy>=1.7"]
dev = ["pytest>=9.1.1", "ruff>=0.6", "mypy>=1.10", "pre-commit>=4.6.2"]

[project.scripts]
ors = "ors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ors"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
